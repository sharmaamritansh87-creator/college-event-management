<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Portal | CollegeWorld</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="page-wrap">
  <h1 class="page-title">Admin Portal</h1>
  <p class="page-sub">Approve events, manage users and keep an eye on the whole system.</p>

  <div class="cw-tabs" id="tabs">
    <button class="cw-tab active" data-tab="overview">Overview &amp; Reports</button>
    <button class="cw-tab" data-tab="events">Manage Events (<span id="cntEvents">0</span>)</button>
    <button class="cw-tab" data-tab="users">Users (<span id="cntUsers">0</span>)</button>
  </div>

  <div id="listArea"><div class="spinner-wrap"><div class="spinner-border text-primary"></div></div></div>
</div>

<!-- Add user -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="userForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Add user</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="uName">Full name *</label>
            <input type="text" class="form-control" id="uName" maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label" for="uEmail">Email *</label>
            <input type="email" class="form-control" id="uEmail" maxlength="150">
          </div>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label class="form-label" for="uRole">Role *</label>
              <select class="form-select" id="uRole">
                <option value="organizer">Club Head (organizer)</option>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-sm-6 mb-3">
              <label class="form-label" for="uPass">Password * (min 6)</label>
              <input type="password" class="form-control" id="uPass" autocomplete="new-password">
            </div>
          </div>
          <div class="mb-3" id="clubRow">
            <label class="form-label" for="uClub">Club name * (for club heads)</label>
            <input type="text" class="form-control" id="uClub" maxlength="100" placeholder="e.g. Robotics Club">
          </div>
          <div id="userError" class="alert alert-danger py-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="userSaveBtn">Create user</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/modals.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
