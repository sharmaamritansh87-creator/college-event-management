<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal | CollegeWorld</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="page-wrap">
  <h1 class="page-title">Student Portal</h1>
  <p class="page-sub">Browse campus events, register with one click and share your participation videos.</p>

  <!-- Filters (only shown on the "All Events" tab) -->
  <div id="eventsToolbar">
    <div class="section-label">Event types being organized</div>
    <div id="categoryPills"></div>
    <div class="row g-2 mt-1 mb-1">
      <div class="col-sm-8">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchBox" placeholder="Search by title, club, venue or keyword">
        </div>
      </div>
      <div class="col-sm-4">
        <select class="form-select" id="showFilter">
          <option value="upcoming">Upcoming events</option>
          <option value="past">Past events</option>
          <option value="all">All events</option>
        </select>
      </div>
    </div>
  </div>

  <div class="cw-tabs" id="tabs">
    <button class="cw-tab active" data-tab="events">All Events (<span id="cntEvents">0</span>)</button>
    <button class="cw-tab" data-tab="mine">My Registrations (<span id="cntMine">0</span>)</button>
    <button class="cw-tab" data-tab="news">Club News (<span id="cntNews">0</span>)</button>
  </div>

  <div id="listArea"><div class="spinner-wrap"><div class="spinner-border text-primary"></div></div></div>
</div>

<!-- Register confirmation -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm registration</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="registerBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Not now</button>
        <button type="button" class="btn btn-primary" id="confirmRegisterBtn">Confirm registration</button>
      </div>
    </div>
  </div>
</div>

<!-- Video link -->
<div class="modal fade" id="videoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="videoForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Participation video link</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-grey mb-3" id="videoEventName"></p>
          <div class="mb-3">
            <label class="form-label" for="videoUrl">Video link (YouTube, Google Drive, etc.) *</label>
            <input type="url" class="form-control" id="videoUrl" placeholder="https://...">
          </div>
          <div class="mb-3">
            <label class="form-label" for="videoNote">Note (optional)</label>
            <input type="text" class="form-control" id="videoNote" maxlength="255">
          </div>
          <div id="videoError" class="alert alert-danger py-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="videoSaveBtn">Save link</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Feedback -->
<div class="modal fade" id="feedbackModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="feedbackForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Event feedback</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-grey mb-3" id="feedbackEventName"></p>
          <div class="mb-3">
            <label class="form-label" for="fbRating">Rating *</label>
            <select class="form-select" id="fbRating">
              <option value="">Choose...</option>
              <option value="5">★★★★★  Excellent</option>
              <option value="4">★★★★☆  Very good</option>
              <option value="3">★★★☆☆  Good</option>
              <option value="2">★★☆☆☆  Fair</option>
              <option value="1">★☆☆☆☆  Poor</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="fbComments">Comments</label>
            <textarea class="form-control" id="fbComments" rows="3" maxlength="2000"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label" for="fbSuggestions">Suggestions</label>
            <textarea class="form-control" id="fbSuggestions" rows="2" maxlength="2000"></textarea>
          </div>
          <div id="feedbackError" class="alert alert-danger py-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="feedbackBtn">Submit feedback</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/student.js"></script>
</body>
</html>
