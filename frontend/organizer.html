<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Head Portal | CollegeWorld</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="page-wrap">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
    <div>
      <h1 class="page-title">Club Head Portal</h1>
      <p class="page-sub mb-0">Create events, track registrations, mark attendance and post announcements for <strong id="clubName"></strong>.</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-soft" id="newsBtn"><i class="bi bi-megaphone"></i> Post announcement</button>
      <button class="btn btn-primary" id="createBtn"><i class="bi bi-plus-lg"></i> Create event</button>
    </div>
  </div>

  <!-- Stat cards -->
  <div class="row g-3 my-3" id="statRow"></div>

  <div class="cw-tabs" id="tabs">
    <button class="cw-tab active" data-tab="events">My Events (<span id="cntEvents">0</span>)</button>
    <button class="cw-tab" data-tab="news">My Announcements (<span id="cntNews">0</span>)</button>
  </div>

  <div id="listArea"><div class="spinner-wrap"><div class="spinner-border text-primary"></div></div></div>
</div>

<!-- Announcement modal -->
<div class="modal fade" id="newsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="newsForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Post club announcement</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="newsTitle">Title *</label>
            <input type="text" class="form-control" id="newsTitle" maxlength="150">
          </div>
          <div class="mb-3">
            <label class="form-label" for="newsContent">Message *</label>
            <textarea class="form-control" id="newsContent" rows="4"></textarea>
          </div>
          <div id="newsError" class="alert alert-danger py-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="newsSaveBtn">Post</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/modals.js"></script>
<script src="js/organizer.js"></script>
</body>
</html>
